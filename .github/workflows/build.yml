name: Build BeeVpn APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build BeeVpn Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK Host Dependencies (libtinfo5)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libtinfo5 libncurses5 || true
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          if [ ! -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          fi

      - name: Accept Licenses & Install Android NDK 17c
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "ndk;17.2.4988734"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/17.2.4988734" >> $GITHUB_ENV

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build BeeVpn Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload BeeVpn APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeeVpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
