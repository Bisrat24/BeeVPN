name: Build BeeVpn APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build BeeVpn Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses & Install NDK 17c
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;17.2.4988734"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/17.2.4988734" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/ndk/17.2.4988734" >> $GITHUB_PATH

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build BeeVpn Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload BeeVpn APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeeVpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
