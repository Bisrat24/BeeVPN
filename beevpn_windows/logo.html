<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 256px; height: 256px; display: flex; align-items: center; justify-content: center; }
  svg { width: 256px; height: 256px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Hexagonal Background Shield -->
    <path fill="#151E2E" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round" d="M64,6 L118,36 L118,92 L64,122 L10,92 L10,36 Z" />
    <!-- Bee Abdomen Striped Stripes -->
    <path fill="#FBBF24" d="M64,55 L74,55 C77,65 77,80 64,95 C51,80 51,65 54,55 Z" />
    <path fill="#0B0F19" d="M56,66 L72,66 C71,72 70,75 64,80 C58,75 57,72 56,66 Z" />
    <path fill="#0B0F19" d="M59,84 L69,84 C68,88 66,91 64,93 C62,91 60,88 59,84 Z" />
    <!-- Bee Head -->
    <path fill="#F59E0B" d="M64,40 C70,40 73,44 73,50 L55,50 C55,44 58,40 64,40 Z" />
    <!-- Bee Antennae -->
    <path fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" d="M60,42 Q54,30 46,32" />
    <path fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" d="M68,42 Q74,30 82,32" />
    <!-- Left Wing (Translucent Glow) -->
    <path fill="rgba(56, 189, 248, 0.55)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round" d="M56,52 C40,40 25,48 35,66 C42,75 52,65 56,52 Z" />
    <!-- Right Wing (Translucent Glow) -->
    <path fill="rgba(56, 189, 248, 0.55)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round" d="M72,52 C88,40 103,48 93,66 C86,75 76,65 72,52 Z" />
</svg>
</body>
</html>
